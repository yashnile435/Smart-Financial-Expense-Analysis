# ===================================================================
# Application Configuration
# Smart Financial Expense Analysis - Stage 1
# ===================================================================

# Application Name & Port
# Port is configurable via SERVER_PORT environment variable (defaults to 8080)
spring.application.name=smart-financial-expense-analysis
server.port=${SERVER_PORT:8080}

# ===================================================================
# Database Configuration (MySQL)
# Database connection settings read from environment variables:
# DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_financial_expense}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA & Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.root=INFO
logging.level.com.smartfinancialexpenseanalysis=DEBUG
logging.level.org.springframework.web=INFO

# ===================================================================
# Initial Administrator Bootstrap
# ===================================================================
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@example.com}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:Admin@123}
